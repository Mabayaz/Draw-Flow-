<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | DrawFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/assets/js/tailwind-config.js"></script>
  <link rel="icon" href="/assets/brand/drawflow-logo.png">
  <link rel="stylesheet" href="/assets/css/site.css">
</head>
<body>
  <div class="texture page-shell min-h-screen bg-background text-foreground">
    <header class="border-b border-border/80 bg-background/90">
      <div class="mx-auto flex h-[4.5rem] max-w-7xl items-center justify-between px-5 sm:px-8">
        <a href="/" class="focus-ring flex items-center gap-3 rounded-md"><span class="brand-logo" aria-hidden="true"></span><span class="font-display text-[1.45rem]">DrawFlow<span class="text-accent">.</span></span></a>
        <div class="flex items-center gap-2"><button type="button" aria-label="Switch to night mode" data-testid="button-theme-toggle" class="focus-ring grid h-10 w-10 place-items-center rounded-full border border-border bg-card text-muted-foreground">&#9790;</button><a href="/" class="focus-ring rounded-full border border-border px-4 py-2 text-xs font-bold">Back Home</a></div>
      </div>
    </header>
    <main class="mx-auto grid max-w-5xl gap-10 px-5 py-12 sm:px-8 lg:grid-cols-[1fr_26rem] lg:items-center lg:py-24">
      <section><p class="font-mono-draw text-[10px] uppercase tracking-[.18em] text-accent">DrawFlow account</p><h1 class="mt-4 font-display text-5xl leading-none sm:text-7xl">Your progress, wherever you draw.</h1><p class="mt-6 max-w-xl leading-7 text-muted-foreground">Sign in to sync your completed topics, exercise levels, scores, quiz attempts, and saved drawings. Guest Mode keeps everything local in this browser.</p></section>
      <section class="rounded-2xl border border-border bg-card p-6 shadow-xl sm:p-8"><div class="mb-6"><p class="font-mono-draw text-[10px] uppercase tracking-[.15em] text-accent">Student login</p><h2 id="auth-title" class="mt-2 font-display text-3xl">Welcome back</h2></div><p id="auth-error" class="mb-4 hidden rounded-lg bg-red-50 p-3 text-xs text-red-700"></p><button id="google-auth" type="button" class="w-full rounded-full border border-border bg-white px-4 py-3 text-sm font-bold">Continue with Google</button><div class="my-5 flex items-center gap-3 text-[10px] uppercase text-muted"><span class="h-px flex-1 bg-border"></span>or email<span class="h-px flex-1 bg-border"></span></div><form id="email-auth" class="space-y-4"><label class="block text-xs font-semibold">Email<input id="auth-email" required type="email" autocomplete="email" class="mt-1 w-full rounded-lg border border-border bg-white px-3 py-2"></label><label class="block text-xs font-semibold">Password<input id="auth-password" required minlength="6" type="password" autocomplete="current-password" class="mt-1 w-full rounded-lg border border-border bg-white px-3 py-2"></label><button id="email-submit" type="submit" class="w-full rounded-full bg-primary px-4 py-3 text-sm font-bold text-primary-foreground">Sign In</button></form><button id="toggle-register" type="button" class="mt-5 w-full text-xs font-semibold text-accent">Need an account? Register here</button><button id="guest-mode" type="button" class="mt-5 w-full rounded-full border border-border px-4 py-3 text-sm font-bold">Continue as Guest</button><p id="cloud-note" class="mt-4 text-center text-[11px] leading-5 text-muted-foreground"></p></section>
    </main>
  </div>
  <script src="/assets/js/site.js"></script>
  <script type="module">
    import { cloudAuthEnabled, continueAsGuest, signIn, signInWithGoogle } from '/assets/js/auth.js';
    const error = document.getElementById('auth-error');
    const note = document.getElementById('cloud-note');
    let registerMode = false;
    const enterSite = () => { sessionStorage.setItem('drawflow-session-access', 'granted'); window.location.href = '/'; };
    note.textContent = cloudAuthEnabled ? 'Cloud accounts are enabled.' : 'Cloud login is not configured yet. Guest Mode is available now. Add Firebase values in auth-config.js to enable sign in.';
    document.getElementById('toggle-register').addEventListener('click', () => { registerMode = !registerMode; document.getElementById('auth-title').textContent = registerMode ? 'Create your account' : 'Welcome back'; document.getElementById('email-submit').textContent = registerMode ? 'Register Account' : 'Sign In'; document.getElementById('toggle-register').textContent = registerMode ? 'Already have an account? Sign In' : 'Need an account? Register here'; });
    document.getElementById('guest-mode').addEventListener('click', () => { continueAsGuest(); enterSite(); });
    document.getElementById('google-auth').addEventListener('click', async () => { try { await signInWithGoogle(); enterSite(); } catch (reason) { error.textContent = reason.message; error.classList.remove('hidden'); } });
    document.getElementById('email-auth').addEventListener('submit', async (event) => { event.preventDefault(); try { await signIn(document.getElementById('auth-email').value, document.getElementById('auth-password').value, registerMode); enterSite(); } catch (reason) { error.textContent = reason.message; error.classList.remove('hidden'); } });
  </script>
</body>
</html>
