<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cube Perspective Challenge | DrawFlow</title>
<link rel="stylesheet" href="/assets/css/site.css">
<style>
:root{--bg:#eee;--panel:#fff;--text:#222;--accent:#fa5c5c;--border:#d8d8d8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:1rem 2rem;background:#fff;border-bottom:1px solid var(--border)}.logo{font-weight:800;font-size:1.3rem}.logo span{color:var(--accent)}.stats{display:flex;gap:.6rem}.pill{border:1px solid var(--border);border-radius:999px;background:var(--bg);padding:.45rem .9rem;font-size:.75rem;font-weight:700}main{display:grid;place-items:center;min-height:calc(100vh - 5rem);padding:2rem}.workspace{position:relative;width:min(680px,calc(100vw - 18rem));aspect-ratio:1;background:#fff;border:2px solid var(--border);border-radius:1.25rem;box-shadow:0 10px 30px #00000014}.workspace canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.toolbar{position:absolute;right:2rem;top:50%;display:flex;flex-direction:column;gap:.55rem;transform:translateY(-50%);border:1px solid var(--border);border-radius:1.5rem;background:#fff;padding:.75rem;box-shadow:0 10px 30px #00000014}.tool{width:7.5rem;border:1px solid var(--border);border-radius:999px;background:#fff;padding:.65rem;font-weight:700;cursor:pointer}.tool.active,.judge{background:var(--accent);border-color:var(--accent);color:#fff}.result{position:absolute;bottom:1.25rem;left:50%;display:none;align-items:center;gap:1rem;transform:translateX(-50%);border:1px solid var(--border);border-radius:1.25rem;background:#fffffff2;padding:.8rem 1.2rem;box-shadow:0 10px 30px #00000020}.result.show{display:flex}.result strong{font-size:2rem;color:var(--accent)}@media(max-width:800px){.workspace{width:min(680px,calc(100vw - 2rem))}.toolbar{position:static;transform:none;flex-direction:row;flex-wrap:wrap;margin-top:1rem}.tool{width:auto}.result{position:fixed;bottom:1rem;white-space:nowrap}}
</style>
</head>
<body>
<header><div class="logo">Cube<span>Challenge</span>.</div><div class="stats"><span id="round-pill" class="pill">Round 1</span><span id="mode-pill" class="pill">Practice</span></div></header>
<main><div class="workspace"><canvas id="guide-canvas"></canvas><canvas id="draw-canvas"></canvas><canvas id="eval-canvas"></canvas><div id="result" class="result"><strong id="rank">D</strong><div><b id="score">0.00 / 100.00</b><br><small id="message">Keep practicing.</small></div><button id="next" class="tool judge">Next Round</button></div></div><div class="toolbar"><button id="pen" class="tool active">Pen</button><button id="eraser" class="tool">Eraser</button><button id="undo" class="tool">Undo</button><button id="clear" class="tool">Clear</button><button id="judge" class="tool judge">Judge!</button></div></main>
<script src="/assets/js/cube-challenge.js"></script>
</body></html>
